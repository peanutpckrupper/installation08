name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      # The online server's address is a repository secret (Settings > Secrets and variables >
      # Actions > I08_SERVER), so it isn't in the source. Without it the exe is LAN only.
      - name: Build installation08.exe
        working-directory: src
        env:
          I08_SERVER: ${{ secrets.I08_SERVER }}
        run: |
          server=()
          if [ -n "$I08_SERVER" ]; then server=("-DI08_SERVER=\"$I08_SERVER\""); fi
          x86_64-w64-mingw32-windres installation08.rc -O coff -o res.o
          x86_64-w64-mingw32-gcc -O2 -c monocypher/monocypher.c -o monocypher.o
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -municode -static -Wall -Wno-unused-parameter "${server[@]}" \
            -o installation08.exe installation08.cpp monocypher.o res.o \
            -ld3d11 -ldxgi -lgdi32 -ld2d1 -ldwrite -ladvapi32 -lws2_32 -lole32 -lwindowscodecs -luuid -lbcrypt
      - uses: actions/upload-artifact@v4
        with:
          name: installation08
          path: |
            src/installation08.exe
            dist/README.txt
