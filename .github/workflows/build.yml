name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Build installation08.exe
        working-directory: src
        run: |
          x86_64-w64-mingw32-windres installation08.rc -O coff -o res.o
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -municode -static -s -Wall -Wno-unused-parameter \
            -o installation08.exe installation08.cpp res.o \
            -ld3d11 -ldxgi -lgdi32 -ld2d1 -ldwrite -ladvapi32
      - uses: actions/upload-artifact@v4
        with:
          name: installation08
          path: |
            src/installation08.exe
            dist/README.txt
